<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Claudio Cerrajería en Carretera</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: white;
        }

        .logo {
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .logo img {
            width: 180px;
            max-width: 80%;
            height: auto;
        }

        h1 {
            margin: 10px 0;
            font-size: 28px;
        }

        .subtitulo {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }

        .horario {
            font-size: 16px;
            margin: 10px auto 25px;
            max-width: 450px;
        }

        .boton {
            display: block;
            width: 90%;
            max-width: 400px;
            margin: 12px auto;
            padding: 15px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .principal {
            background: #ffffff;
            color: #111111;
        }

        .whatsapp {
            background: #25D366;
            color: white;
        }

        .contacto {
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .contacto-titulo {
            font-size: 18px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <!-- LOGO -->
    <div class="logo">
        <img src="logo-cerrajeria.png"
             alt="Claudio Cerrajería">
    </div>

    <h1>Claudio Cerrajería en Carretera</h1>

    <div class="subtitulo">
        🔐 Cerrajería 24/7
    </div>

    <p class="horario">
        Servicio de cerrajería y apertura de emergencia
    </p>


    <!-- CONTACTOS -->

    <div class="contacto">

        <div class="contacto-titulo">
            📞 Contacto 1
        </div>

        <a class="boton principal"
           href="tel:+56945635606">
            📞 Llamar
        </a>

        <a class="boton whatsapp"
           href="https://wa.me/56945635606">
            💬 WhatsApp
        </a>


        <div class="contacto-titulo">
            📞 Contacto 2
        </div>

        <a class="boton principal"
           href="tel:+56942590947">
            📞 Llamar
        </a>

        <a class="boton whatsapp"
           href="https://wa.me/56942590947">
            💬 WhatsApp
        </a>

    </div>

</body>
</html>
